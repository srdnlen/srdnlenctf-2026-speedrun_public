{% extends "base.html" %}
{% block title %}Challenges - Cybercamp 2026{% endblock %}
{% block content %}
<h1 class="board-title">Challenges</h1>

{% for category, items in grouped %}
<section class="cat-section">
  <h2 class="cat-title cat-{{ category|lower }}">{{ category }}</h2>
  <div class="chall-grid">
    {% for c in items %}
    <a class="chall-card" href="/challenge/{{ c.id }}">
      <span class="chall-name">{{ c.name }}</span>
      <span class="chall-points">{{ c.points }}</span>
    </a>
    {% endfor %}
  </div>
</section>
{% endfor %}
{% endblock %}
