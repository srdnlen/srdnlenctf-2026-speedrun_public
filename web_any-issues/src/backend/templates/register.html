{% extends "base.html" %}
{% block title %}Register - Cybercamp 2026{% endblock %}
{% block content %}
<section class="page-head">
  <h1>Register</h1>
  <p class="subtitle">Create your Cybercamp 2026 account.</p>
</section>

<div class="card form-card login-card">
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form method="POST" action="/register" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input type="text" name="username" autocomplete="username" maxlength="32" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="new-password" maxlength="8" required>
    </label>
    <button type="submit" class="btn">Create account</button>
  </form>
  <p class="muted small" style="margin-top:14px;">Already registered? <a href="/login">Login</a>.</p>
</div>
{% endblock %}
